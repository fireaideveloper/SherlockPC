[package]
name = "sherlockpc"
version = "0.1.0"
description = "Evidence-driven local PC investigator"
authors = ["fireaideveloper"]
edition = "2021"

[lib]
name = "sherlockpc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.1", features = ["tray-icon"] }
tauri-plugin-shell = "=2.4.0"

tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
