name: Build Windows candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate release source inputs
        run: python build_support/release_preflight.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Select stable Rust MSVC
        run: rustup default stable-x86_64-pc-windows-msvc
      - name: Build and package
        shell: cmd
        env:
          NO_PAUSE: '1'
        run: BUILD_DESKTOP_WINDOWS.cmd --ci
      - uses: actions/upload-artifact@v4
        with:
          name: SherlockPC-Windows-candidate
          path: release/
          if-no-files-found: error
