<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">SherlockPC desktop illustration</title><desc id="desc">Illustration based on App.tsx and styles.css. Synthetic values. Overview metrics, check presets, evidence report, history and settings; not native application footage.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#0b1320"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#83edc7"/></marker></defs><rect width="1200" height="690" rx="20" fill="url(#bg)"/><g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif"><text x="34" y="48" font-size="18" fill="#83edc7" font-weight="700">DESKTOP EXPERIENCE</text><text x="34" y="80" font-size="16" fill="#a9bed0" font-weight="400">Source-grounded illustration · synthetic values · not a screenshot</text><rect x="30" y="105" width="1140" height="552" rx="16" fill="#0e1926" stroke="#2b4158"/><text x="55" y="145" font-size="25" fill="#eef6fc" font-weight="700">SherlockPC</text><text x="920" y="145" font-size="15" fill="#a9bed0" font-weight="400">English   ·   Dark theme</text><rect x="55" y="170" width="254" height="93" rx="16" fill="#111f30" stroke="#2b4158"/><text x="73" y="197" font-size="12" fill="#a9bed0" font-weight="600">CPU</text><text x="73" y="236" font-size="30" fill="#eef6fc" font-weight="600">18%</text><path d="M185 232h75" fill="none" stroke="#83edc7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="333" y="170" width="254" height="93" rx="16" fill="#111f30" stroke="#2b4158"/><text x="351" y="197" font-size="12" fill="#a9bed0" font-weight="600">MEMORY</text><text x="351" y="236" font-size="30" fill="#eef6fc" font-weight="600">42%</text><path d="M463 232h75" fill="none" stroke="#83edc7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="611" y="170" width="254" height="93" rx="16" fill="#111f30" stroke="#2b4158"/><text x="629" y="197" font-size="12" fill="#a9bed0" font-weight="600">SWAP</text><text x="629" y="236" font-size="30" fill="#eef6fc" font-weight="600">0%</text><path d="M741 232h75" fill="none" stroke="#83edc7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="889" y="170" width="254" height="93" rx="16" fill="#111f30" stroke="#2b4158"/><text x="907" y="197" font-size="12" fill="#a9bed0" font-weight="600">PROCESSES</text><text x="907" y="236" font-size="30" fill="#eef6fc" font-weight="600">156</text><path d="M1019 232h90" fill="none" stroke="#83edc7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="302" font-size="16" fill="#83edc7" font-weight="700">Overview</text><text x="196" y="302" font-size="16" fill="#a9bed0" font-weight="400">Investigation</text><text x="351" y="302" font-size="16" fill="#a9bed0" font-weight="400">History</text><text x="450" y="302" font-size="16" fill="#a9bed0" font-weight="400">Settings</text><path d="M55 315H146" fill="none" stroke="#83edc7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="55" y="336" width="624" height="293" rx="16" fill="#111f30" stroke="#2b4158"/><text x="77" y="372" font-size="22" fill="#eef6fc" font-weight="600">Check the current state</text><text x="77" y="403" font-size="15" fill="#83edc7" font-weight="400">Check CPU  ·  Check memory</text><rect x="77" y="421" width="376" height="45" rx="8" fill="#182a3d" stroke="#2b4158"/><text x="92" y="449" font-size="16" fill="#a9bed0" font-weight="400">Why is CPU usage high?</text><rect x="466" y="421" width="190" height="45" rx="8" fill="#83edc7" stroke="#83edc7"/><text x="480" y="449" font-size="17" fill="#08241d" font-weight="600">Investigate →</text><rect x="77" y="485" width="579" height="120" rx="10" fill="#142d32" stroke="#2d625b"/><text x="98" y="516" font-size="20" fill="#83edc7" font-weight="600">Read the result and its limits</text><text x="98" y="548" font-size="16" fill="#eef6fc" font-weight="400">Observations → hypotheses → evidence</text><text x="98" y="579" font-size="14" fill="#a9bed0" font-weight="400">A signal is a reason to inspect, not proof of a fault.</text><rect x="697" y="336" width="448" height="293" rx="16" fill="#111f30" stroke="#2b4158"/><text x="719" y="372" font-size="22" fill="#eef6fc" font-weight="600">Saved history</text><text x="719" y="409" font-size="15" fill="#a9bed0" font-weight="400">Readiness needs samples AND elapsed span.</text><path d="M719 441H1122" fill="none" stroke="#23473d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M719 441H1025" fill="none" stroke="#83edc7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="719" y="480" font-size="16" fill="#eef6fc" font-weight="400">Recent measurements</text><text x="980" y="480" font-size="14" fill="#a9bed0" font-weight="400">CPU / RAM</text><path d="M719 493H1122" fill="none" stroke="#2b4158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="719" y="521" font-size="16" fill="#eef6fc" font-weight="400">History browser</text><text x="980" y="521" font-size="14" fill="#a9bed0" font-weight="400">Paged states</text><path d="M719 534H1122" fill="none" stroke="#2b4158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="719" y="562" font-size="16" fill="#eef6fc" font-weight="400">History location</text><text x="980" y="562" font-size="14" fill="#a9bed0" font-weight="400">Open folder</text><path d="M719 575H1122" fill="none" stroke="#2b4158" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="719" y="607" font-size="14" fill="#83edc7" font-weight="400">Close window → collection stays in tray</text></g></svg>
