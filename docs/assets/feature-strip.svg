<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="324" viewBox="0 0 1200 324" role="img" aria-labelledby="title desc"><title id="title">Observe, compare, investigate</title><desc id="desc">Three implemented capabilities: periodic system measurements, historical baseline readiness and bounded investigations with evidence, critic and verifier.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#0b1320"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#83edc7"/></marker></defs><rect width="1200" height="324" rx="20" fill="url(#bg)"/><g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif"><text x="34" y="49" font-size="20" fill="#eef6fc" font-weight="700">THREE WAYS TO MAKE SYSTEM LOAD EXPLAINABLE</text><rect x="30" y="77" width="360" height="222" rx="16" fill="#111f30" stroke="#2b4158"/><text x="52" y="115" font-size="15" fill="#83edc7" font-weight="700">01</text><text x="52" y="179" font-size="28" fill="#eef6fc" font-weight="600">Observe</text><text x="52" y="222" font-size="16" fill="#a9bed0" font-weight="400">CPU, RAM, swap and processes</text><text x="52" y="251" font-size="16" fill="#a9bed0" font-weight="400">Periodic local measurements</text><rect x="420" y="77" width="360" height="222" rx="16" fill="#111f30" stroke="#2b4158"/><text x="442" y="115" font-size="15" fill="#83edc7" font-weight="700">02</text><text x="442" y="179" font-size="28" fill="#eef6fc" font-weight="600">Compare</text><text x="442" y="222" font-size="16" fill="#a9bed0" font-weight="400">Saved history becomes a baseline</text><text x="442" y="251" font-size="16" fill="#a9bed0" font-weight="400">Sample count + observation span</text><rect x="810" y="77" width="360" height="222" rx="16" fill="#111f30" stroke="#2b4158"/><text x="832" y="115" font-size="15" fill="#83edc7" font-weight="700">03</text><text x="832" y="179" font-size="28" fill="#eef6fc" font-weight="600">Investigate</text><text x="832" y="222" font-size="16" fill="#a9bed0" font-weight="400">Bounded rules and evidence IDs</text><text x="832" y="251" font-size="16" fill="#a9bed0" font-weight="400">Critic, verifier and explicit limits</text><path d="M151 137h24l12-21 16 31 14-15h45" fill="none" stroke="#83edc7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="550" y="137" width="10" height="9" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><rect x="567" y="128" width="10" height="18" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><rect x="584" y="115" width="10" height="31" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><rect x="601" y="122" width="10" height="24" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><rect x="618" y="103" width="10" height="43" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><rect x="635" y="117" width="10" height="29" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><rect x="652" y="110" width="10" height="36" rx="2" fill="#8fb8ff" stroke="#8fb8ff"/><path d="M954 119h66m-66 12h46m-46 12h55" fill="none" stroke="#83edc7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
