<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="532" viewBox="0 0 1200 532" role="img" aria-labelledby="title desc"><title id="title">Current SherlockPC desktop pipeline</title><desc id="desc">React sends native commands to Rust, which runs a one-shot bundled Python sidecar. The backend stores local SQLite history and runs baseline and investigation logic. Evidence reports return through native IPC. A Rust worker also captures while hidden.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102238"/><stop offset="1" stop-color="#0b1320"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#83edc7"/></marker></defs><rect width="1200" height="532" rx="20" fill="url(#bg)"/><g font-family="DejaVu Sans,Segoe UI,Arial,sans-serif"><text x="34" y="47" font-size="21" fill="#eef6fc" font-weight="700">IMPLEMENTED DESKTOP PIPELINE</text><text x="34" y="77" font-size="16" fill="#a9bed0" font-weight="400">Local requests, local history, inspectable output. No cloud LLM required.</text><rect x="38" y="117" width="325" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="56" y="149" font-size="19" fill="#eef6fc" font-weight="600">React + TypeScript</text><text x="56" y="177" font-size="13" fill="#a9bed0" font-weight="400">Overview · Investigation · History</text><rect x="38" y="232" width="325" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="56" y="264" font-size="19" fill="#eef6fc" font-weight="600">Tauri / Rust runtime</text><text x="56" y="292" font-size="13" fill="#a9bed0" font-weight="400">Native commands · serialized requests</text><rect x="38" y="347" width="325" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="56" y="379" font-size="19" fill="#eef6fc" font-weight="600">Bundled Python sidecar</text><text x="56" y="407" font-size="13" fill="#a9bed0" font-weight="400">One process per request</text><rect x="470" y="347" width="295" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="488" y="379" font-size="19" fill="#eef6fc" font-weight="600">Local SQLite history</text><text x="488" y="407" font-size="13" fill="#a9bed0" font-weight="400">Snapshots + process measurements</text><rect x="863" y="347" width="295" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="881" y="379" font-size="19" fill="#eef6fc" font-weight="600">Investigation logic</text><text x="881" y="407" font-size="13" fill="#a9bed0" font-weight="400">Baseline · rules · hypothesis</text><rect x="863" y="117" width="295" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="881" y="149" font-size="19" fill="#eef6fc" font-weight="600">Evidence-linked report</text><text x="881" y="177" font-size="13" fill="#a9bed0" font-weight="400">Critic · verifier · trace · limits</text><rect x="470" y="117" width="295" height="84" rx="16" fill="#111f30" stroke="#2b4158"/><text x="488" y="149" font-size="19" fill="#eef6fc" font-weight="600">Background worker</text><text x="488" y="177" font-size="13" fill="#a9bed0" font-weight="400">Targets a sample about every 10 s</text><path d="M200 201V232" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M200 316V347" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M363 389H470" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M765 389H863" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M1010 347V201" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M617 201V274H363" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><path d="M863 154H795V100H200V117" fill="none" stroke="#83edc7" stroke-width="2" marker-end="url(#arrow)"/><text x="377" y="372" font-size="12" fill="#a9bed0" font-weight="400">save / read</text><text x="780" y="372" font-size="12" fill="#a9bed0" font-weight="400">read</text><text x="406" y="493" font-size="18" fill="#83edc7" font-weight="400">Close window → tray stays active. Tray Exit → collection stops.</text></g></svg>
